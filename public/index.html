<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imersão de Cura — Rio de Janeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body { 
      background-color: #0b0f19;
      background-image: radial-gradient(circle at 50% 0%, #171c30 0%, #0b0f19 80%);
      color: #ffffff; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
    }
    
    .main-wrapper {
      max-width: 950px;
      width: 100%;
      background: rgba(15, 22, 41, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .main-wrapper {
        grid-template-columns: 350px 1fr;
        padding: 50px;
      }
    }

    /* Coluna da Esquerda: A Imagem/Flyer */
    .flyer-column {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #000;
    }
    .flyer-column img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* Coluna da Direita: Textos e Botão igualzinho ao design */
    .content-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .apresenta {
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    h1 span {
      display: block;
      font-size: 1.5rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-top: 4px;
      letter-spacing: 0px;
    }

    .pastoras-desc {
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 5px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 10px 0;
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .btn-quero-inscrever {
      display: inline-block;
      background: #ffffff;
      color: #0b0f19;
      padding: 16px 32px;
      border-radius: 30px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.15);
      margin-top: 10px;
    }

    .btn-quero-inscrever:hover {
      background: #f1f5f9;
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    
    <!-- COLUNA ESQUERDA: FOTO/FLYER -->
    <div class="flyer-column">
      <img src="banner.jpg.png" alt="Imersão de Cura - Renascer Tijuca" />
    </div>

    <!-- COLUNA DIREITA: CONTEÚDO IDÊNTICO À ARTE -->
    <div class="content-column">
      <div class="apresenta">Renascer Tijuca Apresenta</div>
      
      <h1>
        IMERSÃO DE CURA
        <span>NO RIO DE JANEIRO</span>
      </h1>

      <div class="pastoras-desc">Com Bispa Rosana Abbud e Bispa Amanda Baldoni</div>

      <div class="info-list">
        <div>📅 Sábado, 31 de outubro</div>
        <div>⏰ Das 9h às 17h</div>
        <div>📍 Renascer Tijuca — Av. Paula Sousa, 340, Rio de Janeiro</div>
        <div>🏷️ Inscrição a partir de R$ 40,00</div>
      </div>

      <a href="inscricao.html" class="btn-quero-inscrever">Quero me inscrever</a>
    </div>

  </div>

</body>
</html>
